# Luma Home — energy meters, English version.
# Unofficial derivative of Aurora Glass v3.
# Original project: © 2026 DomotikPro.it (Luca Pinelli).
# Adaptation: Fonkyup.
# Updated October 26, 2026.
# GNU GPL version 3; see LICENSE at the repository root.
#
# Install ONLY ONE variant: English, French, or Italian.
#
# Replace sensor.SENSORE_ENERGIA_KWH in all three places
# with your cumulative energy sensor in kWh, not a power sensor in W.
#
# Installation as a package:
# copy this file to /config/packages/aurora-energia.yaml.
# Enable packages in configuration.yaml:
#
# homeassistant:
#   packages: !include_dir_named packages
#
# If homeassistant already exists, merge the options without duplicating the key.
# Check the configuration before restarting.
#
# The first cycles will be incomplete: this file does not automatically
# reconstruct consumption from before its installation.

utility_meter:
  aurora_energia_oggi:
    name: "Luma Home — Energy today"
    unique_id: aurora_energia_oggi
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: daily

  aurora_energia_mese:
    name: "Luma Home — Energy this month"
    unique_id: aurora_energia_mese
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: monthly

  aurora_energia_anno:
    name: "Luma Home — Energy this year"
    unique_id: aurora_energia_anno
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: yearly

template:
  - sensor:
      - name: "Luma Home — Energy yesterday"
        unique_id: aurora_energia_ieri
        default_entity_id: sensor.aurora_energia_ieri
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {{ state_attr('sensor.aurora_energia_oggi', 'last_period')
             | float(0) }}

      - name: "Luma Home — Energy last month"
        unique_id: aurora_energia_mese_scorso
        default_entity_id: sensor.aurora_energia_mese_scorso
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {{ state_attr('sensor.aurora_energia_mese', 'last_period')
             | float(0) }}
