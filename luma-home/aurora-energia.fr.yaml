# GNU GPL version 3 ; voir LICENSE à la racine du dépôt.
#
# Installez UNE SEULE variante : française, anglaise ou italienne.
#
# Remplacez sensor.SENSORE_ENERGIA_KWH aux trois endroits
# par votre capteur d’énergie cumulée en kWh, pas une puissance en W.
#
# Installation comme package :
# copiez ce fichier dans /config/packages/aurora-energia.yaml.
# Activez les packages dans configuration.yaml :
#
# homeassistant:
#   packages: !include_dir_named packages
#
# Si homeassistant existe déjà, fusionnez les options sans dupliquer la clé.
# Vérifiez la configuration avant de redémarrer.
#
# Les premiers cycles seront incomplets : ce fichier ne reconstitue
# pas automatiquement la consommation antérieure à son installation.

utility_meter:
  aurora_energia_oggi:
    name: "Luma Home — Énergie aujourd’hui"
    unique_id: aurora_energia_oggi
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: daily

  aurora_energia_mese:
    name: "Luma Home — Énergie ce mois-ci"
    unique_id: aurora_energia_mese
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: monthly

  aurora_energia_anno:
    name: "Luma Home — Énergie cette année"
    unique_id: aurora_energia_anno
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: yearly

template:
  - sensor:
      - name: "Luma Home — Énergie hier"
        unique_id: aurora_energia_ieri
        default_entity_id: sensor.aurora_energia_ieri
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {{ state_attr('sensor.aurora_energia_oggi', 'last_period')
             | float(0) }}

      - name: "Luma Home — Énergie le mois précédent"
        unique_id: aurora_energia_mese_scorso
        default_entity_id: sensor.aurora_energia_mese_scorso
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {{ state_attr('sensor.aurora_energia_mese', 'last_period')
             | float(0) }}
