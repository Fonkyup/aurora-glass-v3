# Compteurs d’énergie facultatifs : jour, mois, année, hier et mois précédent.
# UTILISEZ UNE SEULE VERSION de ce fichier (IT, FR ou EN), jamais les trois.
# Les identifiants et noms des capteurs d’origine sont volontairement conservés.
# Remplacez sensor.SENSORE_ENERGIA_KWH aux trois endroits par votre capteur
# d’énergie totale cumulée en kWh (pas un capteur de puissance en W).
# Option A : copiez cette version sous /config/packages/aurora-energia.yaml.
# Dans configuration.yaml, fusionnez cette configuration avec votre section existante :
# homeassistant:
#   packages: !include_dir_named packages
# Option B : fusionnez utility_meter et template dans configuration.yaml.
# Ne créez pas deux clés identiques au même niveau ni de compteurs en double.
# Vérifiez la configuration dans Home Assistant avant de redémarrer.
# Ces compteurs ne reconstituent pas automatiquement l’historique antérieur.

utility_meter:
  aurora_energia_oggi:
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: daily
  aurora_energia_mese:
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: monthly
  aurora_energia_anno:
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: yearly

template:
  - sensor:
      - name: Aurora energia ieri
        unique_id: aurora_energia_ieri
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ state_attr('sensor.aurora_energia_oggi', 'last_period') | float(0) }}"
      - name: Aurora energia mese scorso
        unique_id: aurora_energia_mese_scorso
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ state_attr('sensor.aurora_energia_mese', 'last_period') | float(0) }}"
