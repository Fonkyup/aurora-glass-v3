#
# Installa UNA SOLA variante: italiana, francese o inglese.
#
# Sostituisci sensor.SENSORE_ENERGIA_KWH in tutti e tre i punti
# con il tuo sensore di energia cumulativa in kWh, non di potenza in W.
#
# Installazione come package:
# copia questo file in /config/packages/aurora-energia.yaml.
# Abilita i package in configuration.yaml:
#
# homeassistant:
#   packages: !include_dir_named packages
#
# Se homeassistant esiste già, unisci le opzioni senza duplicare la chiave.
# Verifica la configurazione prima di riavviare.
#
# I primi cicli saranno incompleti: questo file non ricostruisce
# automaticamente i consumi precedenti alla sua installazione.

utility_meter:
  aurora_energia_oggi:
    name: "Luma Home — Energia oggi"
    unique_id: aurora_energia_oggi
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: daily

  aurora_energia_mese:
    name: "Luma Home — Energia questo mese"
    unique_id: aurora_energia_mese
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: monthly

  aurora_energia_anno:
    name: "Luma Home — Energia quest’anno"
    unique_id: aurora_energia_anno
    source: sensor.SENSORE_ENERGIA_KWH
    cycle: yearly

template:
  - sensor:
      - name: "Luma Home — Energia ieri"
        unique_id: aurora_energia_ieri
        default_entity_id: sensor.aurora_energia_ieri
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {{ state_attr('sensor.aurora_energia_oggi', 'last_period')
             | float(0) }}

      - name: "Luma Home — Energia il mese scorso"
        unique_id: aurora_energia_mese_scorso
        default_entity_id: sensor.aurora_energia_mese_scorso
        unit_of_measurement: "kWh"
        device_class: energy
        state: >-
          {{ state_attr('sensor.aurora_energia_mese', 'last_period')
             | float(0) }}
