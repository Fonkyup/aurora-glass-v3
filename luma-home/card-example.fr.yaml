# Exemple complet de carte. Remplacez les entités d’exemple par les vôtres.
# Collez dans l’éditeur YAML de la carte, pas à la racine du tableau de bord.
# Les clés italiennes et room: Cucina sont conservées pour compatibilité.
# assets ci-dessous correspond à une installation manuelle ; adaptez-le à votre installation.
# energy est une section de entities, et non une option à la racine.
# Documentation mise à jour le 26 octobre 2026.

type: custom:luma-home-card
language: fr
assets: /local/luma-home/btn/        # Dossier des images des boutons

entities:
  # --- ÉCLAIRAGE (11 pièces). Entités light.*, switch.* ou autres entités compatibles avec une commande marche/arrêt.
  lights:
    salotto: light.salotto
    ingresso: light.ingresso
    corridoio: light.corridoio
    cucina: light.cucina
    balcone: light.balcone
    camera: light.camera
    cameretta: light.cameretta
    bagno_piccolo: light.bagno_piccolo
    bagno_doccia: light.bagno_doccia
    lavanderia: light.lavanderia
    sgabuzzino: light.sgabuzzino

  # --- ÉCLAIRAGES SUPPLÉMENTAIRES : affichés dans la pièce indiquée et inclus dans « Tout éteindre ».
  extraLights:
    - { k: strip_led, n: Ruban LED, id: light.strip_led, room: Cucina, ic: mdi-led-strip-variant }

  # --- MOUVEMENT : une liste par pièce ; le premier capteur disponible est utilisé.
  motion:
    salotto: [binary_sensor.salotto_movimento]
    ingresso: [binary_sensor.ingresso_movimento]
    cucina: [binary_sensor.cucina_movimento]
    corridoio: [binary_sensor.corridoio_movimento]
    cameretta: [binary_sensor.cameretta_movimento]
    lavanderia: [binary_sensor.lavanderia_movimento]
    sgabuzzino: [binary_sensor.sgabuzzino_movimento]
    camera: [binary_sensor.camera_movimento]

  # --- PORTES ET FENÊTRES (binary_sensor), serrure (lock). Retirez les équipements absents.
  opens:
    ingresso: binary_sensor.porta_ingresso
    balcone_salotto: binary_sensor.balcone_salotto
    balcone_cucina: binary_sensor.balcone_cucina
    cameretta: binary_sensor.finestra_cameretta
    balcone_camera: binary_sensor.balcone_camera
    bagno: binary_sensor.finestra_bagno
    lavanderia: binary_sensor.finestra_lavanderia
    cancello: lock.serratura_ingresso

  alarm: alarm_control_panel.allarme      # Centrale d’alarme
  weather: weather.forecast_home          # Température extérieure et météo
  power: sensor.potenza_casa              # Puissance instantanée affichée sur la page Maison (W)
  climate: climate.salotto                # Appareil de climatisation

  # --- CAMÉRAS (vue Sécurité), facultatives.
  cameras:
    - { n: Entrée, img: camera.ingresso_snapshot, live: camera.ingresso_live, poll: 20 }      # Aperçu et direct
    - { n: Jardin, kind: motion, img: image.giardino_ultimo_movimento, cam: camera.giardino, poll: 60 }  # Dernière image seulement

  # --- ÉNERGIE (vue Énergie)
  energy:
    power: sensor.potenza_casa            # Puissance instantanée en W, nécessaire pour cette vue
    voltage: sensor.tensione_casa         # Tension en V, facultative
    energyTotal: sensor.energia_totale    # Énergie totale en kWh ; state_class: total_increasing (historique de 14 jours)
    today: sensor.aurora_energia_oggi     # Consommation du jour en kWh
    yesterday: sensor.aurora_energia_ieri
    month: sensor.aurora_energia_mese
    lastMonth: sensor.aurora_energia_mese_scorso
    year: sensor.aurora_energia_anno
    price: input_number.prezzo_energia    # Tarif par kWh : réglable depuis la carte ; vérifier la disponibilité de cet assistant dans Home Assistant.
    priceDefault: 0.30                    # Tarif d’exemple tant que le vôtre n’est pas défini
    base: sensor.consumo_di_fondo         # Facultatif
    avg3: sensor.potenza_media_3_ore      # Facultatif
    limit: input_number.soglia_potenza    # Facultatif : limite du cadran
    limitDefault: 3000                    # W, valeur utilisée si l’entité de limite ci-dessus est absente
    liveRefresh: 3                        # Intervalle d’actualisation en secondes ; 0 désactive la demande explicite. Utile avec Shelly et appareils similaires.
    appliances:                           # Appareils facultatifs : puissance en W et énergie du jour en kWh
      - { n: Lave-linge, p: sensor.lavatrice_potenza, e: sensor.lavatrice_energia_oggi, ic: mdi-washing-machine, c: "#38BDF8" }
      - { n: Réfrigérateur, p: sensor.frigo_potenza, e: null, ic: mdi-fridge, c: "#34D399" }
