name: Check JavaScript copies

on:
  push:
    branches:
      - bilingual
    paths:
      - "luma-home/www/aurora-v3/aurora-v3.js"
      - "dist/aurora-v3.js"
      - ".github/workflows/check-javascript.yml"
  pull_request:
    paths:
      - "luma-home/www/aurora-v3/aurora-v3.js"
      - "dist/aurora-v3.js"
      - ".github/workflows/check-javascript.yml"

permissions:
  contents: read

jobs:
  check:
    name: Syntax and distribution consistency
    runs-on: ubuntu-latest

    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check luma-home/www/aurora-v3/aurora-v3.js
          node --check dist/aurora-v3.js

      - name: Check required initialization blocks
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "luma-home/www/aurora-v3/aurora-v3.js"
            "dist/aurora-v3.js"
          )

          required=(
            "function boot()"
            "var PROPS ="
            "var CSS ="
            "var HTML ="
            "var OVERRIDES ="
            "class AuroraV3Card"
            "function motionSummaryLabel"
          )

          for file in "${files[@]}"; do
            for marker in "${required[@]}"; do
              if ! grep -Fq "$marker" "$file"; then
                echo "::error file=$file::Missing required marker: $marker"
                exit 1
              fi
            done
            echo "PASS: required initialization markers found in $file"
          done          

      - name: Compare reference and distribution
        shell: bash
        run: |
          set -euo pipefail

          reference="luma-home/www/aurora-v3/aurora-v3.js"
          distribution="dist/aurora-v3.js"

          echo "SHA-256:"
          sha256sum "$reference" "$distribution"

          if cmp -s "$reference" "$distribution"; then
            echo "PASS: both JavaScript files are byte-for-byte identical."
          else
            echo "::error::Reference and distribution differ. Review before merging."
            exit 1
          fi
